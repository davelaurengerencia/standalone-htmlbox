<!doctype html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>HTMLBox — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full">
  <main x-data="adminApp()" x-init="init()" x-cloak class="min-h-screen">

    <!-- Top bar -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center">
          <i class="fa-solid fa-box-open text-white text-sm"></i>
        </div>
        <span class="font-bold bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">HTMLBox Admin</span>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <template x-if="user">
          <div class="flex items-center gap-2">
            <span class="text-slate-400" x-text="user.email"></span>
            <template x-if="user.is_platform_owner">
              <span class="px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Platform Owner</span>
            </template>
            <button @click="logout()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg transition">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </template>
      </div>
    </header>

    <!-- Login -->
    <template x-if="!user">
      <section class="max-w-md mx-auto mt-24 p-6 bg-slate-900 border border-slate-800 rounded-2xl space-y-4">
        <h1 class="text-lg font-bold">Ingresar</h1>
        <p class="text-xs text-slate-400">Te enviaremos un magic link por email. En dev, el link se imprime en la consola del control-plane.</p>
        <form @submit.prevent="requestMagicLink()" class="space-y-3">
          <input type="email" x-model="email" required placeholder="tu@email.com"
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <button type="submit" :disabled="busy" class="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 rounded-xl font-medium text-sm transition">
            <span x-text="busy ? 'Enviando…' : 'Enviar magic link'"></span>
          </button>
        </form>
        <template x-if="lastMessage">
          <p class="text-xs text-slate-400" x-text="lastMessage"></p>
        </template>
        <template x-if="previewLink">
          <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs space-y-2">
            <p class="font-semibold text-emerald-400">[DEV] Magic link</p>
            <a :href="previewLink" class="break-all text-emerald-300 hover:text-emerald-200 underline" x-text="previewLink"></a>
          </div>
        </template>
      </section>
    </template>

    <!-- Dashboard -->
    <template x-if="user">
      <section class="max-w-6xl mx-auto p-6 space-y-6">
          <!-- Crear tenant (solo platform owner) -->
          <template x-if="user.is_platform_owner">
            <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
              <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Crear tenant</h2>
              <form @submit.prevent="createTenant()" class="flex flex-wrap gap-2">
                <input x-model="newTenant.slug" placeholder="slug" required
                       class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm flex-1 min-w-[120px]">
                <input x-model="newTenant.name" placeholder="Nombre del tenant" required
                       class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm flex-1 min-w-[200px]">
                <button class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium">
                  <i class="fa-solid fa-plus mr-1"></i> Crear
                </button>
              </form>
            </div>
          </template>

          <!-- Lista de tenants -->
          <div>
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-2">Tenants</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <template x-for="t in tenants" :key="t.id">
                <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-2 cursor-pointer hover:border-indigo-500 transition"
                     @click="selectTenant(t)">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="font-bold" x-text="t.name"></div>
                      <div class="text-xs text-slate-500 font-mono" x-text="t.slug"></div>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-full"
                          :class="t.status === 'active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'"
                          x-text="t.status"></span>
                  </div>
                </div>
              </template>
              <template x-if="tenants.length === 0">
                <div class="p-6 text-center text-slate-500 text-sm">No pertenecés a ningún tenant todavía.</div>
              </template>
            </div>
          </div>

          <!-- Workspaces del tenant seleccionado -->
          <template x-if="currentTenant">
            <div class="space-y-3">
              <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">
                Workspaces — <span class="text-indigo-400" x-text="currentTenant.slug"></span>
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <template x-for="w in workspaces" :key="w.id">
                  <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="font-bold" x-text="w.name"></div>
                        <div class="text-xs text-slate-500">
                          <span x-text="w.box_count"></span> boxes
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </section>
    </template>

    <!-- Toast -->
    <div x-show="toast" x-transition
         class="fixed bottom-4 right-4 px-4 py-2 bg-emerald-600 rounded-xl text-sm shadow-lg"
         x-text="toast"></div>
  </main>

  <script>
    function adminApp() {
      return {
        user: null,
        email: '',
        busy: false,
        lastMessage: '',
        previewLink: null,
        tenants: [],
        currentTenant: null,
        workspaces: [],
        newTenant: { slug: '', name: '' },
        toast: null,
        _toastTimer: null,

        async init() {
          await this.loadMe()
        },

        async loadMe() {
          const res = await fetch('/api/auth/me', { credentials: 'include' })
          const data = await res.json()
          this.user = data.user
          if (this.user) await this.loadTenants()
        },

        async requestMagicLink() {
          this.busy = true
          this.lastMessage = ''
          this.previewLink = null
          try {
            const res = await fetch('/api/auth/request', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: this.email }),
            })
            const data = await res.json()
            this.lastMessage = data.message || 'Listo. Revisá tu email.'
            if (data._dev_preview) this.previewLink = data._dev_preview
          } catch (err) {
            this.lastMessage = 'Error: ' + err.message
          } finally {
            this.busy = false
          }
        },

        async logout() {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
          this.user = null
          this.tenants = []
          this.currentTenant = null
          this.workspaces = []
        },

        async loadTenants() {
          const res = await fetch('/api/me/tenants', { credentials: 'include' })
          const data = await res.json()
          this.tenants = data.tenants ?? []
        },

        async createTenant() {
          const res = await fetch('/api/tenants', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.newTenant),
          })
          const data = await res.json()
          if (data.tenant) {
            this.newTenant = { slug: '', name: '' }
            await this.loadTenants()
            this.showToast('Tenant creado.')
          } else {
            this.showToast('Error: ' + (data.error || 'desconocido'))
          }
        },

        async selectTenant(t) {
          this.currentTenant = t
          const res = await fetch(`/api/tenants/${t.id}/workspaces`, { credentials: 'include' })
          const data = await res.json()
          this.workspaces = data.workspaces ?? []
        },

        showToast(msg) {
          this.toast = msg
          clearTimeout(this._toastTimer)
          this._toastTimer = setTimeout(() => { this.toast = null }, 3000)
        },
      }
    }
  </script>
</body>
</html>
